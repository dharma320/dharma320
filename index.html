</script><script id="server-integration">
(function(){
  'use strict';

  const AUTH_KEY='ASTS_MULTI_AUTH_TOKEN_V2_';
  const SERVER_TOKEN_KEY='ASTS_MULTI_SERVER_TOKEN_V2_';
  const SERVER_ATTEMPT_KEY='ASTS_MULTI_SERVER_ATTEMPT_V2_';
  const SERVER_DEADLINE_KEY='ASTS_MULTI_SERVER_DEADLINE_V2_';
  let serverBusy=false;
  let lastServerSave=0;
  // Nomor urut request aktif. Dipakai supaya callback (sukses/gagal) yang
  // datang terlambat -- yaitu SETELAH timeout 12 detik sudah menembak duluan --
  // benar-benar diabaikan dan tidak lagi mengubah UI/state secara diam-diam.
  let serverRequestSeq=0;

  function isOnline(){
    return typeof google!=='undefined' && google.script && google.script.run;
  }

  function callServer(name,args,ok,fail){
    if(!isOnline()){
      if(fail) fail({message:'Server ujian belum terhubung. Muat ulang halaman atau hubungi guru pengawas.'});
      else alert('Server ujian belum terhubung. Muat ulang halaman atau hubungi guru pengawas.');
      return false;
    }
    if(serverBusy) return false;
    serverBusy=true;
    var myRequestId=++serverRequestSeq;
    // Request ini sudah "selesai" (baik oleh success/failure handler asli
    // maupun oleh timeout) hanya sekali; dipakai untuk mencegah handler
    // ganda memicu ok()/fail() dua kali untuk request yang sama.
    var settled=false;
    try{
      var runner=google.script.run
        .withSuccessHandler(function(result){
          // Abaikan jika sudah ada request baru berjalan, atau request ini
          // sudah dianggap selesai lebih dulu oleh timeout 12 detik.
          if(myRequestId!==serverRequestSeq || settled) return;
          settled=true;
          serverBusy=false;
          if(ok) ok(result);
        })
        .withFailureHandler(function(error){
          if(myRequestId!==serverRequestSeq || settled) return;
          settled=true;
          serverBusy=false;
          if(fail) fail(error);
          else alert('Koneksi server gagal:\n\n'+(error&&error.message?error.message:String(error)));
        });
      if(typeof runner[name]!=='function'){
        serverBusy=false;
        var er={message:'Fungsi server "'+name+'" tidak ditemukan. Pastikan Code.gs dan deployment sudah diperbarui.'};
        if(fail) fail(er); else alert(er.message);
        return false;
      }
      runner[name].apply(runner,args||[]);
      // Jangan biarkan layar login menggantung selamanya jika deployment/server
      // tidak mengembalikan callback. Setelah timeout ini menembak, request
      // ditandai "settled" sehingga callback asli yang datang belakangan
      // (baik sukses maupun gagal) tidak lagi memanggil ok()/fail() kedua
      // kalinya atau diam-diam mengubah layar setelah pesan timeout tampil.
      setTimeout(function(){
        if(myRequestId===serverRequestSeq && serverBusy && !settled){
          settled=true;
          serverBusy=false;
          if(fail) fail({message:'Server tidak merespons dalam 12 detik. Pastikan Web App memakai deployment terbaru dari Code.gs.'});
        }
      },12000);
      return true;
    }catch(error){
      serverBusy=false;
      settled=true;
      if(fail) fail(error); else alert('Kesalahan server:\n\n'+(error&&error.message?error.message:String(error)));
      return false;
    }
  }

  function ensureServerSync(ok,fail){
    if(!isOnline()){
      if(fail) fail({message:'Server ujian belum terhubung. Muat ulang halaman atau hubungi guru pengawas.'});
      return;
    }
    google.script.run.withSuccessHandler(function(info){
      if(info && info.version===APP_VERSION &&
         info.authSchema===EXPECTED_SERVER_AUTH_SCHEMA &&
         info.questionPacketSizes && Number(info.questionPacketSizes[1])===EXPECTED_QUESTION_PACKET_SIZES[1] && Number(info.questionPacketSizes[2])===EXPECTED_QUESTION_PACKET_SIZES[2] &&
         Number(info.examDurationMs)===EXPECTED_EXAM_DURATION_MS){
        SERVER_AUTH_SCHEMA_OK=true;
        SERVER_SYNC_MESSAGE='Server login dan konfigurasi ASTS tersinkron.';
        if(ok) ok(info);
      }else{
        SERVER_AUTH_SCHEMA_OK=false;
        SERVER_SYNC_MESSAGE='Versi server tidak sama dengan halaman siswa. Perbarui deployment Web App terlebih dahulu.';
        if(fail) fail({message:SERVER_SYNC_MESSAGE});
      }
    }).withFailureHandler(function(error){
      SERVER_AUTH_SCHEMA_OK=false;
      SERVER_SYNC_MESSAGE='Server login tidak dapat diverifikasi. Pastikan deployment Web App menggunakan Code.gs terbaru.';
      if(fail) fail({message:SERVER_SYNC_MESSAGE});
    }).getAppSyncInfo();
  }

  function authKey(username){
    return AUTH_KEY+String(username||'').toUpperCase();
  }
  function saveAuth(r){
    try{
      localStorage.setItem(authKey(r.username),JSON.stringify({
        token:r.token,nis:r.nis,name:r.name,username:r.username,expiresAt:r.expiresAt||0
      }));
    }catch(e){}
  }
  function getAuth(){
    try{
      if(!state.studentUsername) return null;
      var raw=localStorage.getItem(authKey(state.studentUsername));
      return raw?JSON.parse(raw):null;
    }catch(e){return null;}
  }
  function clearAuth(){
    try{
      if(state.studentUsername) localStorage.removeItem(authKey(state.studentUsername));
    }catch(e){}
  }

  function saveServerSession(r){
    try{
      var key=state.studentUsername||'';
      localStorage.setItem(SERVER_TOKEN_KEY+key,r.token||'');
      localStorage.setItem(SERVER_ATTEMPT_KEY+key,r.attemptId||'');
      localStorage.setItem(SERVER_DEADLINE_KEY+key,String(r.deadline||0));
    }catch(e){}
  }
  function getServerSession(){
    try{
      var key=state.studentUsername||'';
      return {
        token:localStorage.getItem(SERVER_TOKEN_KEY+key)||'',
        attemptId:localStorage.getItem(SERVER_ATTEMPT_KEY+key)||'',
        deadline:Number(localStorage.getItem(SERVER_DEADLINE_KEY+key)||0)
      };
    }catch(e){return {token:'',attemptId:'',deadline:0};}
  }
  function clearServerSession(){
    try{
      var key=state.studentUsername||'';
      localStorage.removeItem(SERVER_TOKEN_KEY+key);
      localStorage.removeItem(SERVER_ATTEMPT_KEY+key);
      localStorage.removeItem(SERVER_DEADLINE_KEY+key);
    }catch(e){}
  }

  function calcResult(){
    let correct=0,wrong=0,blank=0;
    DATA.forEach(function(it,i){
      if(!isAnswered(it,state.answers[i])) blank++;
      else if(isCorrect(it,state.answers[i])) correct++;
      else wrong++;
    });
    return {correct,wrong,blank,score:DATA.length?Math.round(correct/DATA.length*100):0};
  }

  function canonicalAnswerForServer(item,ans){
    if(item.type==='single'){
      if(!Number.isInteger(ans)) return null;
      return Array.isArray(item._order)?item._order[ans]:ans;
    }
    if(item.type==='multi'){
      if(!Array.isArray(ans)) return [];
      const order=Array.isArray(item._order)?item._order:null;
      return ans.map(Number).filter(Number.isInteger).map(i=>order?order[i]:i).sort((a,b)=>a-b);
    }
    if(item.type==='grid'){
      return Array.isArray(ans)?ans.map(v=>v===null||v===undefined?null:Number(v)):[];
    }
    if(item.type==='match'){
      const order=Array.isArray(item._order)?item._order:null;
      return Array.isArray(ans)?ans.map(v=>{
        if(v===null||v===undefined||v==='') return null;
        const i=Number(v); return order?order[i]:i;
      }):[];
    }
    return null;
  }

  function buildServerResponses(){
    return DATA.map(function(item,i){
      return {qid:Number(item._qid),type:item.type,answer:canonicalAnswerForServer(item,state.answers[i])};
    });
  }

  // Memetakan jawaban canonical dari server kembali ke posisi pilihan
  // yang sedang ditampilkan pada sesi ini. Ini membuat sesi dapat dilanjutkan
  // meskipun browser/halaman sempat terputus.
  function restoreServerResponses(responses,currentIndex){
    if(!Array.isArray(responses) || !DATA.length) return false;
    const byQid={};
    DATA.forEach(function(item,i){ byQid[String(item._qid)]=i; });
    let restored=0;
    const nextAnswers=DATA.map(function(item){
      if(item.type==='multi') return [];
      if(item.type==='grid' || item.type==='match') return Array((item.stmts||item.left||[]).length).fill(null);
      return null;
    });

    responses.forEach(function(r){
      const i=byQid[String(r&&r.qid)];
      if(i===undefined || !r) return;
      const item=DATA[i];
      const canonical=r.answer;
      if(item.type==='single'){
        if(canonical===null || canonical===undefined || canonical==='') return;
        const c=Number(canonical);
        const order=Array.isArray(item._order)?item._order:null;
        const shown=order ? order.indexOf(c) : c;
        if(Number.isInteger(shown) && shown>=0 && shown<item.opts.length){ nextAnswers[i]=shown; restored++; }
      }else if(item.type==='multi'){
        if(!Array.isArray(canonical)) return;
        const order=Array.isArray(item._order)?item._order:null;
        const shown=canonical.map(Number).map(function(c){return order?order.indexOf(c):c;}).filter(function(v){return Number.isInteger(v)&&v>=0&&v<item.opts.length;});
        nextAnswers[i]=shown; if(shown.length) restored++;
      }else if(item.type==='grid'){
        if(Array.isArray(canonical)){
          nextAnswers[i]=canonical.map(function(v){return v===null||v===undefined?null:Number(v);});
          if(nextAnswers[i].some(function(v){return v!==null&&v!==undefined;})) restored++;
        }
      }else if(item.type==='match'){
        if(Array.isArray(canonical)){
          const order=Array.isArray(item._order)?item._order:null;
          nextAnswers[i]=canonical.map(function(v){
            if(v===null||v===undefined||v==='') return null;
            const c=Number(v); return order?order.indexOf(c):c;
          });
          if(nextAnswers[i].some(function(v){return v!==null&&v!==undefined;})) restored++;
        }
      }
    });
    state.answers=nextAnswers;
    const ci=Number(currentIndex);
    state.current=Number.isInteger(ci)?Math.max(0,Math.min(ci,DATA.length-1)):0;
    state.flags=Array(DATA.length).fill(false);
    return restored>0;
  }

  // Login username + password untuk mode latihan dan ujian.
  // Tidak ada lagi validasi NIS pada handler login. NIS hanya diambil dari server
  // setelah username + password berhasil diautentikasi.
  const originalAttach=attachHandlers;
  attachHandlers=function(){
    originalAttach();

    if(state.screen==='login'){
      const b=document.getElementById('startBtn');
      const forgot=document.getElementById('forgotPasswordBtn');
      if(forgot) forgot.onclick=function(){
        const box=document.getElementById('forgotBox');
        if(box) box.classList.toggle('hidden');
      };
      if(b) b.onclick=function(){
        if(serverBusy) return;

        const username=(document.getElementById('usernameInput')||{}).value||'';
        const password=(document.getElementById('passwordInput')||{}).value||'';
        const msg=document.getElementById('loginMsg');
        if(msg) msg.textContent='Memeriksa akun...';

        if(!/^SOS-[A-Z0-9]{3,4}$/i.test(username.trim())){
          if(msg) msg.textContent='Username harus seperti SOS-1234 atau SOS-TQU.';
          return;
        }
        if(!/^[A-Za-z0-9]{4,6}$/.test(password.trim())){
          if(msg) msg.textContent='Password harus tepat 4 digit angka.';
          return;
        }

        b.disabled=true;
        b.textContent='Memeriksa...';

        // Autentikasi langsung. Verifikasi sinkronisasi tidak boleh menjadi
        // prasyarat login karena jika getAppSyncInfo gagal/hang, siswa akan
        // terjebak selamanya pada pesan 'Memeriksa akun...'.
        callServer('authenticateStudent',[username,password],function(r){
          b.disabled=false;
          b.textContent='Masuk';

          if(!r||!r.ok){
            if(msg) msg.textContent=(r&&r.message)||'Username atau password salah.';
            return;
          }

          if(r.appVersion && r.appVersion!==APP_VERSION){
            if(msg) msg.textContent='Server masih menggunakan versi '+r.appVersion+'. Deploy versi terbaru dari Code.gs terlebih dahulu.';
            return;
          }

          state.studentName=r.name||'';
          state.studentNIS=r.nis||'';
          state.studentUsername=r.username||username.trim().toUpperCase();
          state.studentAuthToken=r.token||'';
          saveAuth(r);

          if(state.mode!=='exam'){
            DATA=getPacketData(state.selectedPacket,'training');
            window.DATA=DATA;
            resetAnswers();
            state.screen='start';
            render();
            return;
          }

          callServer('checkAttempt',[state.studentAuthToken,state.selectedPacket],function(a){
            if(!a||!a.ok){
              if(msg) msg.textContent=(a&&a.status==='DISABLED')?'Paket Ujian belum aktif, silahkan hubungi guru':((a&&a.message)||'Sesi ujian tidak dapat diverifikasi.');
              return;
            }

            if(a.status==='COMPLETED'||a.status==='COMPLETED_TIMEOUT'){
              alert('AKSES DITOLAK\n\nAkun '+state.studentUsername+' sudah menyelesaikan ASTS ini. Percobaan kedua tidak diizinkan.');
              return;
            }

            DATA=getPacketData(state.selectedPacket,'exam',a.questionIds,a.token||state.studentAuthToken);
            window.DATA=DATA;

            // Jika ada draft lokal dari akun yang sama, pulihkan jawaban.
            var draft=null;
            try{draft=typeof getDraft==='function'?getDraft():null;}catch(e){draft=null;}

            if(a.status==='IN_PROGRESS'){
              // Server menjadi sumber utama resume. Jika data server belum ada,
              // gunakan draft lokal sebagai fallback agar jawaban tidak hilang.
              saveServerSession({token:a.token||getServerSession().token,attemptId:a.attemptId,deadline:a.deadline});
              callServer('getAttemptProgress',[state.studentAuthToken,state.selectedPacket,a.attemptId,a.token||state.studentAuthToken],function(progress){
                let restored=false;
                if(progress&&progress.ok){
                  restored=restoreServerResponses(progress.responses,progress.currentIndex);
                  if(!restored && draft && String(draft.studentUsername||'').toUpperCase()===String(state.studentUsername).toUpperCase()){
                    try{restored=restoreDraft(draft);}catch(e){restored=false;}
                  }
                  state.serverAttemptId=progress.attemptId||a.attemptId;
                  state.serverToken=progress.token||a.token;
                  state.serverDeadline=progress.deadline||a.deadline;
                }
                if(!restored) resetAnswers();
                state.timeLeft=Math.max(0,Math.ceil((Number((progress&&progress.deadline)||a.deadline)-Date.now())/1000));
                if(state.timeLeft<=0){ alert('Waktu ASTS telah habis.'); return; }
                state.screen='exam';
                startTimer();
                render();
              },function(){
                // Jika fungsi resume server belum tersedia pada deployment,
                // tetap coba pulihkan dari draft lokal.
                let restored=false;
                if(draft && String(draft.studentUsername||'').toUpperCase()===String(state.studentUsername).toUpperCase()){
                  try{restored=restoreDraft(draft);}catch(e){restored=false;}
                }
                if(!restored) resetAnswers();
                saveServerSession({token:a.token||getServerSession().token,attemptId:a.attemptId,deadline:a.deadline});
                state.timeLeft=Math.max(0,Math.ceil((Number(a.deadline)-Date.now())/1000));
                state.screen='exam';
                startTimer();
                render();
              });
              return;
            }

            resetAnswers();
            state.screen='start';
            render();
          },function(err){
            b.disabled=false;
            b.textContent='Masuk';
            if(msg) msg.textContent=err&&err.message?err.message:'Gagal memeriksa sesi ujian.';
          });
        },function(err){
          b.disabled=false;
          b.textContent='Masuk';
          if(msg) msg.textContent=err&&err.message?err.message:'Login gagal.';
        });
      };

      const p=document.getElementById('passwordInput');
      if(p) p.onkeydown=function(e){
        if(e.key==='Enter') document.getElementById('startBtn').click();
      };
    }

    if(state.screen==='start' && state.mode==='exam'){
      const b=document.getElementById('startBtn');
      if(b) b.onclick=function(){
        if(serverBusy) return;
        const auth=state.studentAuthToken||(getAuth()||{}).token;
        if(!auth){alert('Sesi login tidak ditemukan. Silakan login kembali.');return;}

        b.disabled=true;
        b.textContent='Memulai...';

        callServer('startExam',[auth,state.selectedPacket],function(r){
          b.disabled=false;
          b.textContent='Mulai Ujian';

          if(!r||!r.ok){
            if(r&&r.status==='COMPLETED_TIMEOUT') alert('Waktu ASTS sudah habis.');
            else if(r&&r.status==='DISABLED') alert('Paket Ujian belum aktif, silahkan hubungi guru');
            else alert(r&&r.message||'Ujian tidak dapat dimulai.');
            return;
          }

          saveServerSession(r);
          state.serverAttemptId=r.attemptId;
          state.serverToken=r.token;
          state.serverDeadline=r.deadline;
          try{window.clearDraft();}catch(e){}
          DATA=getPacketData(state.selectedPacket,'exam',r.questionIds,r.token||state.studentAuthToken);
          window.DATA=DATA;
          resetAnswers();
          state.timeLeft=Math.max(0,Math.ceil((Number(r.deadline)-Date.now())/1000));
          state.screen='exam';
          startTimer();
          render();
        });
      };
    }

    if(state.screen==='result' && state.mode==='exam'){
      const retry=document.getElementById('retryBtn');
      if(retry) retry.onclick=function(){
        alert('Ujian tidak dapat diulang. Jika ada masalah teknis, hubungi guru untuk melakukan reset percobaan.');
      };
    }
  };

  // Autosave ke server: maksimal 1x per 15 detik dan hanya jika jawaban berubah.
  // Jika ada perubahan di antara dua simpanan, simpanan susulan dijadwalkan otomatis.
  const SAVE_GAP_MS=15000; let saveTrailTimer=null; let lastSavedSig='';
  function doAutosave(){
    if(state.screen!=='exam' || state.mode!=='exam') return;
    const ss=getServerSession();
    if(!(ss.token && ss.attemptId && state.studentAuthToken)) return;
    const responses=buildServerResponses();
    const sig=JSON.stringify(responses)+'|'+state.current;
    if(sig===lastSavedSig) return;
    lastServerSave=Date.now();
    callServer('saveProgress',[{
      authToken:state.studentAuthToken,
      packet:state.selectedPacket,
      attemptId:ss.attemptId,
      token:ss.token,
      responses:responses,
      currentIndex:state.current
    }],function(r){
      lastSavedSig=sig;
      const el=document.getElementById('saveStatus');
      if(el) el.textContent=r&&r.status==='COMPLETED_TIMEOUT'?'✓ Waktu habis':'✓ Tersimpan';
      if(r&&r.status==='COMPLETED_TIMEOUT' && state.screen==='exam'){
        if(state.timerId) clearInterval(state.timerId);
        state.timerId=null;
        alert('Waktu ASTS telah habis. Jawaban terakhir sudah disimpan.');
        clearServerSession();
        try{window.clearDraft();}catch(e){}
        state.screen='result';
        render();
      }
    },function(err){
      const el=document.getElementById('saveStatus');
      if(el) el.textContent='⚠ Belum tersimpan';
    });
  }
  const oldRender=render;
  render=function(){
    oldRender.apply(this,arguments);
    if(state.screen==='exam' && state.mode==='exam'){
      const wait=SAVE_GAP_MS-(Date.now()-lastServerSave);
      if(wait<=0) doAutosave();
      else if(!saveTrailTimer) saveTrailTimer=setTimeout(function(){ saveTrailTimer=null; doAutosave(); },wait+50);
    }
  };

  // Submit Mode Ujian selalu melalui server.
  const oldFinish=finishExam;
  finishExam=function(){
    if(state.mode!=='exam' || !state.studentNIS){
      oldFinish();
      return;
    }
    if(serverBusy) return;

    if(state.timerId) clearInterval(state.timerId);
    state.timerId=null;

    const auth=state.studentAuthToken||(getAuth()||{}).token;
    const ss=getServerSession();
    if(!auth||!ss.attemptId||!ss.token){
      alert('Sesi ujian server tidak ditemukan. Silakan hubungi guru.');
      return;
    }

    const responses=buildServerResponses();
    const summary=calcResult();

    callServer('submitExam',[{
      authToken:auth,
      packet:state.selectedPacket,
      attemptId:ss.attemptId,
      token:ss.token,
      responses:responses,
      summary:summary
    }],function(resp){
      if(!resp||!resp.ok){
        alert(resp&&resp.message||'Jawaban belum berhasil disimpan ke server.');
        return;
      }
      clearServerSession();
      try{window.clearDraft();}catch(e){}
      state.serverResult=resp;
      state.screen='result';
      render();
      window.scrollTo(0,0);
    });
  };
  window.finishExam=finishExam;
  window.__serverExam={isOnline:isOnline};

  // Sinkronkan status paket dari server saat halaman pertama kali dibuka.
  loadTryoutStatus();
  // Segarkan status AKTIF/NONAKTIF paket saat admin mengubahnya (tanpa merender ulang form login).
  setInterval(function(){ if(state.screen==='login' && !document.hidden) loadTryoutStatus(true); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && state.screen==='login') loadTryoutStatus(true); });

  // Simpan draft lokal setiap kali render agar browser yang tertutup dapat dipulihkan.
})();
</script>

<script id="asts-security-script">
(function(){
  'use strict';
  var examActive=false, protectedNow=false, shield, watermark, restoreTimer=null;

  function isExam(){
    try{
      return !!(window.state && state.mode==='exam' && state.screen==='exam');
    }catch(e){ return false; }
  }

  function ensureUi(){
    if(!shield){
      shield=document.createElement('div');
      shield.className='asts-capture-shield';
      shield.setAttribute('aria-hidden','true');
      shield.innerHTML='<div class="box"><h2>Perlindungan Ujian Aktif</h2><p>Tampilan soal sementara disembunyikan karena halaman kehilangan fokus atau berpindah dari layar ujian. Kembali ke halaman ASTS untuk melanjutkan.</p></div>';
      document.body.appendChild(shield);
    }
    if(!watermark){
      watermark=document.createElement('div');
      watermark.className='asts-security-watermark';
      watermark.setAttribute('aria-hidden','true');
      document.body.appendChild(watermark);
    }
    if(window.state){
      watermark.textContent='ASTS — DILINDUNGI\\n'+
        String(state.studentUsername||state.studentNIS||'SISWA')+
        '  •  '+new Date().toLocaleString('id-ID');
    }
  }

  function setProtected(on){
    if(!isExam()) return;
    ensureUi();
    protectedNow=!!on;
    document.body.classList.toggle('asts-capture-protected',protectedNow);
    shield.classList.toggle('show',protectedNow);
  }

  function refreshExamState(){
    var active=isExam();
    examActive=active;
    document.body.classList.toggle('asts-security-active',active);
    if(!active){
      protectedNow=false;
      if(shield) shield.classList.remove('show');
      document.body.classList.remove('asts-capture-protected');
      return;
    }
    ensureUi();
  }

  /* Blokir tindakan browser yang umum dipakai untuk menyalin/menyimpan layar. */
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(function(type){
    document.addEventListener(type,function(e){
      if(isExam()){ e.preventDefault(); e.stopPropagation(); }
    },true);
  });

  document.addEventListener('keydown',function(e){
    if(!isExam()) return;
    var k=String(e.key||'').toLowerCase();
    var ctrl=e.ctrlKey||e.metaKey;
    var shift=e.shiftKey;
    var blocked =
      k==='printscreen' ||
      (ctrl && (k==='p'||k==='s'||k==='c'||k==='x'||k==='u')) ||
      (ctrl && shift && (k==='i'||k==='j'||k==='c')) ||
      k==='f12';
    if(blocked){
      e.preventDefault(); e.stopPropagation();
      if(k==='printscreen'){
        setProtected(true);
        clearTimeout(restoreTimer);
        restoreTimer=setTimeout(function(){setProtected(false);},1800);
        try{
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText('');
          }
        }catch(err){}
    }
  }},true);

  // Hanya blur pada jendela/halaman yang dihitung. Blur pada tombol (mis. saat jawaban
  // dipilih lalu tampilan dirender ulang) tidak boleh memicu layar perlindungan.
  window.addEventListener('blur',function(e){
    if(e && e.target && e.target!==window && e.target!==document) return;
    if(isExam()) setProtected(true);
  },true);

  // Pemulihan: bila layar perlindungan menyala padahal halaman sedang aktif, sentuhan membukanya.
  document.addEventListener('pointerdown',function(){
    if(protectedNow && isExam() && !document.hidden && document.hasFocus()) setProtected(false);
  },true);

  document.addEventListener('visibilitychange',function(){
    if(isExam() && document.hidden) setProtected(true);
    else if(isExam() && !document.hidden){
      clearTimeout(restoreTimer);
      restoreTimer=setTimeout(function(){setProtected(false);},350);
    }
  },true);

  window.addEventListener('focus',function(e){
    if(e && e.target && e.target!==window && e.target!==document) return;
    if(isExam() && !document.hidden){
      clearTimeout(restoreTimer);
      restoreTimer=setTimeout(function(){setProtected(false);},350);
    }
  },true);

  window.addEventListener('beforeprint',function(){
    if(isExam()) setProtected(true);
  });
  window.addEventListener('afterprint',function(){
    if(isExam() && !document.hidden) setProtected(false);
  });

  /* Hook render agar status perlindungan mengikuti perpindahan login/start/exam/result. */
  var tries=0;
  var hook=setInterval(function(){
    tries++;
    try{
      if(typeof window.render==='function' && !window.__astsSecurityRenderHook){
        var base=window.render;
        window.render=function(){
          var r=base.apply(this,arguments);
          setTimeout(refreshExamState,0);
          return r;
        };
        window.__astsSecurityRenderHook=true;
        refreshExamState();
        clearInterval(hook);
      }else if(tries>120) clearInterval(hook);
    }catch(e){}
  },100);

  document.addEventListener('DOMContentLoaded',refreshExamState);
})();
</script>
<script id="asts-camera-script">
/* ===== KAMERA PENGAWAS: preview + foto berkala selama ujian =====
   Foto dikirim lewat google.script.run LANGSUNG (bukan callServer) supaya tidak
   bentrok dengan kunci serverBusy milik autosave/submit. */
(function(){
  'use strict';
  var CAMERA_REQUIRED = true;      // true = soal tertutup sampai kamera aktif; false = kamera opsional
  var FIRST_SNAP_MS   = 6000;      // foto pertama setelah kamera siap
  var SNAP_INTERVAL_MS= 60000;     // jarak antar foto
  var SNAP_JITTER_MS  = 15000;     // acak +/- agar tidak bisa ditebak
  var SNAP_WIDTH      = 320;       // lebar foto (px)
  var JPEG_QUALITY    = 0.55;

  var stream=null, video=null, preview=null, gate=null, starting=false, snapTimer=null;
  var lastError='', reported={}, retryQueue=[], sending=false;

  function S(){ return window.state||null; }
  function isExam(){ var s=S(); return !!(s && s.mode==='exam' && s.screen==='exam'); }
  function online(){ return typeof google!=='undefined' && google.script && google.script.run; }

  function sess(){
    var s=S()||{}, u=s.studentUsername||'';
    var att=s.serverAttemptId, tok=s.serverToken;
    try{
      att=att||localStorage.getItem('ASTS_MULTI_SERVER_ATTEMPT_V2_'+u);
      tok=tok||localStorage.getItem('ASTS_MULTI_SERVER_TOKEN_V2_'+u);
    }catch(e){}
    return {authToken:s.studentAuthToken,packet:s.selectedPacket,attemptId:att,token:tok};
  }

  function injectStyle(){
    if(document.getElementById('astsCamStyle')) return;
    var st=document.createElement('style'); st.id='astsCamStyle';
    st.textContent=
      '#astsCamPreview{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:2147482000;background:#111;border:0;border-radius:0;overflow:hidden;opacity:.24;pointer-events:none}'+
      '#astsCamPreview video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}'+
      '#astsCamPreview .tag{position:absolute;left:6px;top:5px;font:600 9px "IBM Plex Mono",monospace;color:#fff;background:rgba(180,69,58,.9);padding:2px 6px;border-radius:10px;letter-spacing:.06em}'+
      '#astsCamPreview.bad{border-color:#B4453A}'+
      '#astsCamGate{position:fixed;inset:0;z-index:2147482500;background:rgba(35,33,32,.94);display:none;align-items:center;justify-content:center;padding:20px}'+
      '#astsCamGate.show{display:flex}'+
      '#astsCamGate .box{max-width:460px;background:#F7F3E8;border:1px solid #CFC4A6;border-radius:6px;padding:26px 24px;font-family:"IBM Plex Sans",sans-serif;color:#232120}'+
      '#astsCamGate h2{margin:0 0 10px;font-family:Fraunces,serif;font-size:22px}'+
      '#astsCamGate p{margin:0 0 12px;font-size:14px;line-height:1.55}'+
      '#astsCamGate .note{font-size:12px;color:#5B564C}'+
      '#astsCamGate .err{font-size:12px;color:#B4453A;font-family:"IBM Plex Mono",monospace;word-break:break-word}'+
      '#astsCamGate button{font:600 14px "IBM Plex Sans",sans-serif;background:#30406E;color:#EDE7D9;border:0;border-radius:3px;padding:10px 18px;cursor:pointer}'+
      '#astsCamGate button.alt{background:#5B564C}'+
      '#astsCamGate a.btn{font:600 14px "IBM Plex Sans",sans-serif;background:#4C7A52;color:#fff;border-radius:3px;padding:10px 18px;text-decoration:none}'+
      '#astsCamPreview.bad{box-shadow:inset 0 0 0 5px #B4453A}';
    document.head.appendChild(st);
  }

  function setDot(bad){ var d=document.getElementById('astsCamDot'); if(d){ d.classList.toggle('bad',!!bad); d.textContent=bad?'● KAMERA BERMASALAH':'● KAMERA AKTIF'; } }
  function ensureUi(){
    injectStyle();
    if(!preview){
      preview=document.createElement('div'); preview.id='astsCamPreview';
      video=document.createElement('video');
      video.muted=true; video.autoplay=true; video.playsInline=true;
      video.setAttribute('playsinline',''); video.setAttribute('muted','');
      var tag=document.createElement('span'); tag.className='tag'; tag.textContent='● KAMERA';
      preview.appendChild(video); preview.appendChild(tag);
      document.body.appendChild(preview);
    }
    if(!gate){
      gate=document.createElement('div'); gate.id='astsCamGate';
      gate.innerHTML='<div class="box"><h2>Kamera diperlukan</h2>'+
        '<p id="astsCamMsg"></p><p class="note" id="astsCamHelp" style="display:none"></p><p class="err" id="astsCamErr"></p>'+
        '<p><button id="astsCamRetry" type="button">Aktifkan Kamera</button> <button id="astsCamReload" type="button" class="alt">Muat Ulang Halaman</button> <a id="astsCamLink" class="btn" target="_blank" rel="noopener" style="display:none">Buka Halaman Ujian Resmi</a></p>'+
        '<p class="note">Selama ujian, foto dari kamera diambil secara berkala dan hanya dapat dilihat oleh guru. Waktu ujian tetap berjalan selama kamera belum aktif.</p></div>';
      document.body.appendChild(gate);
      gate.querySelector('#astsCamRetry').onclick=function(){ retryBlockedUntil=0; startCamera(); };
      gate.querySelector('#astsCamReload').onclick=function(){ try{location.reload();}catch(e){} };
    }
  }

  function showGate(msg,err,opt){
    if(!CAMERA_REQUIRED) return;
    ensureUi();
    opt=opt||{};
    gate.querySelector('#astsCamMsg').textContent=msg;
    gate.querySelector('#astsCamErr').textContent=err||'';
    var h=gate.querySelector('#astsCamHelp'); h.textContent=opt.help||''; h.style.display=opt.help?'block':'none';
    var l=gate.querySelector('#astsCamLink');
    if(opt.link && typeof EXAM_URL==='string' && EXAM_URL){ l.href=EXAM_URL; l.style.display='inline-block'; } else { l.style.display='none'; }
    gate.classList.add('show');
  }
  function hideGate(){ if(gate) gate.classList.remove('show'); }

  function report(type){
    if(reported[type] && Date.now()-reported[type]<20000) return;
    reported[type]=Date.now();
    if(!online()) return;
    var p=sess(); if(!p.attemptId||!p.token||!p.authToken) return;
    p.type=type;
    try{ google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(){}).reportCameraEvent(p); }catch(e){}
  }

  /* ---------- diagnosis konteks ---------- */
  var EXAM_URL = '';            // opsional: alamat resmi halaman ujian (HTTPS). Jika diisi, ditampilkan sebagai tombol saat kamera diblokir Apps Script.
  var retryBlockedUntil = 0;    // auto-coba-ulang ditahan sampai waktu ini (0 = boleh sekarang)

  function isAppsScriptFrame(){
    try{ return /(^|\.)googleusercontent\.com$/i.test(location.hostname); }catch(e){ return false; }
  }
  function policyBlocksCamera(){
    try{
      var pp=document.permissionsPolicy||document.featurePolicy;
      if(pp && typeof pp.allowsFeature==='function') return !pp.allowsFeature('camera');
    }catch(e){}
    return false;
  }
  function isInAppBrowser(){
    return /FBAN|FBAV|Instagram|MicroMessenger|WhatsApp|TikTok|Snapchat|Telegram|Line\/|GSA\/|; wv\)/i.test(navigator.userAgent||'');
  }
  function queryPermission(){
    try{
      if(navigator.permissions && navigator.permissions.query){
        return navigator.permissions.query({name:'camera'}).then(function(r){ return r.state; },function(){ return ''; });
      }
    }catch(e){}
    return Promise.resolve('');
  }
  function getCam(c){ return navigator.mediaDevices.getUserMedia(c); }

  function onStream(s){
    starting=false;
    if(!isExam()){ s.getTracks().forEach(function(t){t.stop();}); return; }
    stream=s; video.srcObject=s;
    var p=video.play(); if(p&&p.catch) p.catch(function(){});
    preview.classList.remove('bad'); setDot(false);
    s.getVideoTracks().forEach(function(t){
      t.onended=function(){ stream=null; preview.classList.add('bad'); setDot(true); clearTimeout(snapTimer);
        retryBlockedUntil=Date.now()+8000;
        report('camera_off'); if(isExam()) showGate('Kamera terputus atau dimatikan. Aktifkan kembali untuk melanjutkan.',''); };
    });
    hideGate(); scheduleSnap(FIRST_SNAP_MS);
  }

  function onFail(e){
    starting=false; stream=null;
    var n=(e&&e.name)||'Error'; lastError=n+(e&&e.message?': '+e.message:'');
    queryPermission().then(function(state){
      var msg, help='', type, link=false, permanent=false;
      if(n==='NotAllowedError'||n==='SecurityError'){
        if(isAppsScriptFrame()||policyBlocksCamera()){
          type='blocked'; permanent=true; link=!!EXAM_URL;
          msg='Kamera diblokir karena halaman ujian dibuka lewat tautan Google Apps Script. Browser tidak mengizinkan kamera di dalam tautan tersebut.';
          help='Solusi: buka ujian lewat alamat resmi yang diberikan guru (bukan tautan script.google.com), lalu masuk kembali.';
        }else if(isInAppBrowser()){
          type='in_app_browser'; permanent=true;
          msg='Halaman ini dibuka di dalam aplikasi lain (WhatsApp, Instagram, dll.) yang memblokir kamera.';
          help='Salin tautan ujian lalu tempel di Chrome atau Safari.';
        }else if(state==='denied'){
          type='denied';
          msg='Izin kamera untuk situs ini sedang diblokir.';
          help='Ketuk ikon gembok / pengaturan di sebelah alamat situs → Izin → Kamera → Izinkan. Setelah itu kembali ke halaman ini; kamera akan dicoba otomatis. Jika tidak, tekan "Muat Ulang Halaman".';
        }else{
          type='denied';
          msg='Izin kamera belum diberikan.';
          help='Tekan "Aktifkan Kamera", lalu pilih "Izinkan" / "Allow" pada jendela yang muncul. Jika jendela tidak muncul, buka pengaturan situs di browser dan izinkan kamera.';
        }
      }else if(n==='NotFoundError'||n==='OverconstrainedError'||n==='DevicesNotFoundError'){
        type='no_camera'; msg='Kamera tidak ditemukan pada perangkat ini.';
        help='Pastikan perangkat memiliki kamera depan yang berfungsi.';
      }else if(n==='NotReadableError'||n==='TrackStartError'||n==='AbortError'){
        type='error'; msg='Kamera sedang dipakai aplikasi lain atau tidak dapat dibuka.';
        help='Tutup aplikasi lain yang memakai kamera (video call, kamera, dll.), lalu coba lagi.';
      }else{
        type='error'; msg='Kamera tidak dapat diaktifkan.';
      }
      // Jangan memanggil getUserMedia berulang-ulang di latar belakang: tunggu tombol / kembali ke halaman.
      retryBlockedUntil = permanent ? Infinity : Date.now()+ (type==='denied' ? 3600000 : 15000);
      if(preview){ preview.classList.add('bad'); setDot(true); }
      showGate(msg,lastError,{help:help,link:link});
      report(type);
    });
  }

  function startCamera(){
    if(starting || stream) return;
    ensureUi();
    if(window.isSecureContext===false){
      lastError='isSecureContext=false';
      retryBlockedUntil=Infinity;
      showGate('Halaman ujian harus dibuka lewat alamat HTTPS agar kamera dapat dipakai.',lastError);
      report('error'); return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      lastError='getUserMedia tidak tersedia';
      retryBlockedUntil=Infinity;
      showGate('Browser ini tidak mendukung kamera. Gunakan Chrome/Edge/Safari terbaru dan buka lewat HTTPS.',lastError);
      report('error'); return;
    }
    starting=true;
    showGate('Menunggu izin kamera… Pilih "Izinkan" / "Allow" pada jendela yang muncul di browser.','');
    getCam({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false})
      .catch(function(e){
        var n=(e&&e.name)||'';
        if(n==='OverconstrainedError'||n==='NotFoundError'||n==='ConstraintNotSatisfiedError'){
          return getCam({video:true,audio:false});   // cadangan: tanpa batasan resolusi / arah kamera
        }
        throw e;
      })
      .then(onStream,onFail);
  }

  function stopCamera(){
    clearTimeout(snapTimer); snapTimer=null; starting=false;
    if(stream){ try{stream.getTracks().forEach(function(t){t.onended=null;t.stop();});}catch(e){} }
    stream=null; reported={}; retryQueue=[]; retryBlockedUntil=0;
    if(video) video.srcObject=null;
    if(preview&&preview.parentNode) preview.parentNode.removeChild(preview);
    var dd=document.getElementById('astsCamDot'); if(dd&&dd.parentNode) dd.parentNode.removeChild(dd);
    if(gate&&gate.parentNode) gate.parentNode.removeChild(gate);
    preview=video=gate=null;
  }

  function scheduleSnap(ms){
    clearTimeout(snapTimer);
    snapTimer=setTimeout(capture,ms);
  }
  function nextDelay(){ return Math.max(25000,SNAP_INTERVAL_MS+(Math.random()*2-1)*SNAP_JITTER_MS); }

  var darkCount=0, darkRestarted=false;
  function restartCamera(){
    clearTimeout(snapTimer);
    if(stream){ try{stream.getTracks().forEach(function(t){t.onended=null;t.stop();});}catch(e){} }
    stream=null; if(video) video.srcObject=null;
    startCamera();
  }
  function capture(){
    if(!isExam()||!stream||!video){ return; }
    if(video.readyState<2||!video.videoWidth){ scheduleSnap(3000); return; }
    try{
      var w=SNAP_WIDTH, h=Math.round(video.videoHeight/video.videoWidth*w);
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var x=c.getContext('2d'); x.drawImage(video,0,0,w,h);
      var px=x.getImageData(0,0,w,h).data, lum=0, n=0;
      for(var q=0;q<px.length;q+=64){ lum+=px[q]+px[q+1]+px[q+2]; n+=3; }
      if(n && lum/n<6){
        // Frame hitam: coba nyalakan ulang kamera sekali; jika tetap hitam, laporkan ke admin
        // dan tetap kirim fotonya sebagai bukti (tidak diam-diam dibuang).
        darkCount++;
        if(preview) preview.classList.add('bad');
        if(darkCount===3 && !darkRestarted){ darkRestarted=true; restartCamera(); return; }
        if(darkCount<6){ scheduleSnap(8000); return; }
        report('dark_frame');
      }else{
        darkCount=0; darkRestarted=false;
        if(preview) preview.classList.remove('bad');
      }
      var s=S()||{};
      var label=String(s.studentUsername||s.studentNIS||'')+'  '+new Date().toLocaleString('id-ID');
      x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(0,h-16,w,16);
      x.fillStyle='#fff'; x.font='10px monospace'; x.fillText(label,5,h-5);
      send(c.toDataURL('image/jpeg',JPEG_QUALITY));
    }catch(e){}
    scheduleSnap(nextDelay());
  }

  function send(image){
    if(!online()) return;
    var p=sess(); if(!p.attemptId||!p.token||!p.authToken) return;
    p.image=image;
    try{
      google.script.run
        .withSuccessHandler(function(r){ if(r&&!r.ok&&!r.skipped){ queue(image); } })
        .withFailureHandler(function(){ queue(image); })
        .saveSnapshot(p);
    }catch(e){}
  }
  function queue(image){
    retryQueue.push(image); if(retryQueue.length>3) retryQueue.shift();
    if(!sending) setTimeout(flush,30000);
  }
  function flush(){
    sending=false;
    if(!isExam()||!retryQueue.length) return;
    send(retryQueue.shift());
    if(retryQueue.length){ sending=true; setTimeout(flush,30000); }
  }

  function refresh(){
    if(isExam()){
      if(!stream && !starting && Date.now()>=retryBlockedUntil) startCamera();
      else if(stream){
        var t=stream.getVideoTracks()[0];
        if(t && t.readyState==='ended'){ stream=null; report('camera_off'); showGate('Kamera terputus. Aktifkan kembali untuk melanjutkan.',''); }
      }
    }else if(stream||preview||gate||starting){
      stopCamera();
    }
  }

  var tries=0, hook=setInterval(function(){
    tries++;
    try{
      if(typeof window.render==='function' && !window.__astsCameraRenderHook){
        var base=window.render;
        window.render=function(){ var r=base.apply(this,arguments); setTimeout(refresh,0); return r; };
        window.__astsCameraRenderHook=true; clearInterval(hook); refresh();
      }else if(tries>120) clearInterval(hook);
    }catch(e){}
  },100);
  setInterval(refresh,2000); // jaring pengaman
  // Setelah siswa mengubah izin di pengaturan browser lalu kembali ke halaman ini, coba lagi otomatis
  // (kecuali konteks yang memang diblokir permanen, mis. di dalam Apps Script / aplikasi lain).
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && retryBlockedUntil!==Infinity) retryBlockedUntil=0;
  });
})();
</script>
