<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTS Sosiologi Kelas X & XII Tahun Pelajaran 2026/2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE7D9; --paper-alt:#E4DCC8; --card:#F7F3E8;
    --ink:#232120; --ink-soft:#5B564C;
    --indigo:#30406E; --indigo-soft:#5A6796;
    --ochre:#C08A22; --coral:#B4453A; --green:#4C7A52;
    --line:#CFC4A6; --shadow:0 2px 0 rgba(35,33,32,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Fraunces',serif;}
  #app{max-width:1000px;margin:0 auto;padding:28px 20px 80px;}

  .sociogram{position:absolute;inset:0;pointer-events:none;opacity:0.55;}
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--paper-alt);border-radius:4px;padding:40px 32px;margin-bottom:28px;}
  .hero-inner{position:relative;z-index:2;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ochre);display:inline-block;}
  h1.title{font-family:'Fraunces',serif;font-weight:900;font-size:42px;line-height:1.06;margin:0 0 10px;color:var(--ink);}
  .subtitle{font-size:15.5px;color:var(--ink-soft);max-width:560px;line-height:1.55;margin:0 0 26px;}

  /* LOGIN FORM */
  .login-form{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:40px 32px;max-width:500px;margin:0 auto;}
  .login-form h2{font-family:'Fraunces',serif;font-size:28px;margin:0 0 24px;color:var(--ink);}
  .form-group{margin-bottom:20px;}
  .form-group label{display:block;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;}
  .form-group input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:15px;background:var(--paper);}
  .form-group input:focus{outline:none;border-color:var(--indigo);background:white;}
  .form-group input[readonly]{background:var(--paper-alt);color:var(--indigo);font-weight:600;cursor:not-allowed;}
  .form-group .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .form-group .nis-display{margin-top:8px;padding:10px 12px;background:var(--paper-alt);border:1px solid var(--line);border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--indigo);min-height:20px;transition:all 0.3s;}
  .form-group .nis-display.success{background:rgba(76,122,82,0.1);border-color:var(--green);color:var(--green);}
  .form-group .nis-display.error{background:rgba(180,69,58,0.1);border-color:var(--coral);color:var(--coral);}
  #nisOptions{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px;max-height:200px;overflow-y:auto;}
  #nisOptions .option-item{padding:8px 10px;margin-bottom:6px;background:var(--paper);border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:13px;transition:all 0.2s;}
  #nisOptions .option-item:hover{background:var(--indigo);color:var(--paper);border-color:var(--indigo);}
  #nisOptions .option-item:last-child{margin-bottom:0;}
  
  .packet-select{margin-bottom:28px;}
  .packet-select h3{font-family:'Fraunces',serif;font-size:16px;margin:0 0 14px;color:var(--ink);}
  .packet-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;}
  .packet-btn{width:100%;min-width:0;min-height:68px;padding:9px 4px;border:2px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;line-height:1.2;color:var(--ink);text-align:center;transition:all 0.2s;overflow-wrap:anywhere;word-break:normal;}
  .packet-btn:hover{border-color:var(--indigo-soft);}.packet-btn .packet-code,.packet-btn .packet-number,.packet-btn .packet-off{display:block;text-align:center;white-space:nowrap}.packet-btn .packet-code{font-weight:700}.packet-btn .packet-number{margin-top:3px;font-size:1.3em;font-weight:700}.packet-btn .packet-off{margin-top:3px;font-size:.8em;letter-spacing:.02em}
  .packet-btn.selected{border-color:var(--indigo);background:var(--indigo);color:var(--paper);}
  .packet-btn:disabled{opacity:.55;cursor:not-allowed;background:var(--paper);color:var(--ink-soft);border-style:dashed;}
  .packet-btn:disabled:hover{border-color:var(--line);}
  
  .form-actions{display:flex;gap:12px;margin-top:28px;}
  .forgot-password{display:block;width:100%;margin-top:12px;padding:0;border:0;background:transparent;color:var(--indigo);font-family:'IBM Plex Sans',sans-serif;font-size:13px;text-decoration:underline;cursor:pointer;text-align:center;}
  .forgot-password:hover{color:var(--coral);}
  .forgot-box{margin-top:12px;padding:12px 14px;border:1px dashed var(--ochre);background:rgba(192,138,34,.08);border-radius:3px;font-size:12.5px;line-height:1.55;color:var(--ink-soft);}
  .forgot-box b{color:var(--ink);}


  /* ===== LOGIN — TAMPILAN SPLIT SCREEN (redesain) ===== */
  .login-split{position:relative;display:grid;grid-template-columns:1.05fr 1fr;min-height:600px;border-radius:14px;overflow:hidden;margin-bottom:28px;box-shadow:0 18px 50px rgba(30,26,60,.22);}
  .login-split-left{position:relative;background:linear-gradient(150deg,#2148c9 0%,#5236ab 52%,#7c3aa8 100%);color:#fff;padding:44px 42px 90px;display:flex;flex-direction:column;overflow:hidden;}
  .login-badge{display:inline-block;border:3px solid #131a3a;background:#3355e0;color:#fff;font-family:'Fraunces',serif;font-weight:900;font-size:24px;letter-spacing:.03em;padding:9px 20px;margin-bottom:32px;box-shadow:4px 4px 0 rgba(0,0,0,.28);align-self:flex-start;}
  .login-eyebrow-lt{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75);margin:-18px 0 26px;}
  .login-features{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px;position:relative;z-index:2;}
  .login-features li{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:500;line-height:1.4;}
  .login-features .chk{flex:none;width:19px;height:19px;border:2px solid rgba(255,255,255,.9);border-radius:4px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);margin-top:1px;}
  .login-features .chk svg{width:12px;height:12px;stroke:#fff;}
  .login-split-wave{position:absolute;left:-2%;right:-2%;bottom:-2px;line-height:0;z-index:1;pointer-events:none;}
  .login-split-wave svg{width:104%;display:block;}
  .login-split-right{position:relative;background:radial-gradient(circle at 30% 20%,#efe9f8,#d8cdec 55%,#c3aee3 100%);display:flex;align-items:center;justify-content:center;padding:44px 30px;overflow:hidden;}
  .login-illustration{position:absolute;inset:0;opacity:.9;pointer-events:none;}
  .login-brandmark{position:absolute;top:18px;left:50%;right:auto;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4a3b7a;background:rgba(255,255,255,.78);padding:6px 16px;border-radius:20px;backdrop-filter:blur(2px);z-index:2;white-space:nowrap;}
  .login-brandmark .dot{width:8px;height:8px;border-radius:50%;background:#1fae8e;}
  .login-card{position:relative;z-index:2;background:#fff;border-radius:12px;box-shadow:0 20px 45px rgba(30,20,70,.28);width:100%;max-width:380px;overflow:hidden;}
  .login-card-head{background:linear-gradient(120deg,#5b3fae,#7c3aa8);color:#fff;text-align:center;padding:15px;font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:.1em;font-size:14px;}
  .login-card-body{padding:26px 24px 28px;}
  .login-card-body .form-group,.login-card-body .packet-select{margin-bottom:16px;}
  .login-card-body .packet-select{margin-bottom:16px;}
  .login-card-body .packet-select h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;font-weight:600;margin:0 0 8px;}
  .login-card-body .packet-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;}
  .login-card-body .packet-btn{min-height:72px;padding:7px 2px;font-size:9.5px;line-height:1.08;white-space:normal;overflow:hidden;overflow-wrap:normal;word-break:normal;border-radius:6px;}
  .input-icon-group{display:flex;align-items:stretch;border:1px solid #ddd6ee;border-radius:7px;overflow:hidden;background:#f5f2fb;transition:border-color .15s;}
  .input-icon-group:focus-within{border-color:#5b3fae;}
  .input-icon-group .icon{flex:none;width:42px;display:flex;align-items:center;justify-content:center;background:#1fae8e;color:#fff;}
  .input-icon-group .icon svg{width:17px;height:17px;}
  .input-icon-group input{border:0;background:transparent;flex:1;min-width:0;padding:11px 12px;font-size:14.5px;font-family:'IBM Plex Sans',sans-serif;color:#26203c;}
  .input-icon-group input:focus{outline:none;}
  .input-icon-group .toggle-eye{flex:none;width:38px;display:flex;align-items:center;justify-content:center;background:#1fae8e;color:#fff;border:0;cursor:pointer;}
  .input-icon-group .toggle-eye svg{width:16px;height:16px;}
  .login-card-body .field-block{margin-bottom:17px;}
  .login-card-body .field-block .hint{margin:6px 2px 0;}
  .login-card-body label.field-label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:7px;}
  .login-card-body .packet-btn{background:#f5f2fb;border-color:#ddd6ee;color:#332a55;}
  .login-card-body .packet-btn:hover{border-color:#9c86d6;}
  .login-card-body .packet-btn.selected{background:linear-gradient(120deg,#5b3fae,#7c3aa8);border-color:#5b3fae;color:#fff;}
  .login-card-body .packet-btn .packet-code{font-size:17px;line-height:1.12;font-weight:800;white-space:normal;display:block;text-align:center;letter-spacing:.01em;}
  .login-card-body .packet-btn .packet-code span{font-size:17px;font-weight:800;}
  .login-card-body .packet-btn .packet-number{display:none;}
  .login-card-body .packet-btn:disabled{background:#f5f2fb;color:#a79ecb;}.login-card-body .packet-btn .packet-status{display:block;margin-top:6px;font-size:9px;font-weight:700;letter-spacing:.08em;color:#168d72;}.login-card-body .packet-btn.disabled-by-server{opacity:.65;}
  .packet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;}
  .login-card-body .packet-head h3{margin:0;}
  .packet-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:999px;line-height:1.4;}
  .packet-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .packet-badge.on{color:#168d72;background:#e3f6f0;}
  .packet-badge.off{color:#c0392b;background:#fdeceb;}
  .login-submit{width:100%;text-align:center;text-transform:uppercase;letter-spacing:.06em;font-size:14px;background:linear-gradient(120deg,#5b3fae,#7c3aa8)!important;box-shadow:0 8px 18px rgba(91,63,174,.35)!important;}
  .login-submit:hover{background:linear-gradient(120deg,#4c3396,#6a2f92)!important;}
  @media(max-width:820px){
    .login-split{grid-template-columns:1fr;}
    .login-split-left{padding:34px 24px 70px;}
    .login-split-right{padding:30px 20px 40px;}
    .login-brandmark{display:none;}
  }


  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .meta-chip{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:3px;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:120px;}
  .meta-chip .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .meta-chip .v{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--indigo);}

  .topic-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .topic-pill{border:1px solid var(--indigo-soft);color:var(--indigo);font-size:12px;padding:5px 11px;border-radius:20px;background:rgba(48,64,110,0.06);}

  button.primary{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;background:var(--indigo);color:var(--paper);border:none;padding:14px 26px;border-radius:3px;cursor:pointer;box-shadow:var(--shadow);flex:1;}
  button.primary:hover{background:#233156;}
  button.primary:active{transform:translateY(1px);}
  button.primary:disabled{opacity:.4;cursor:not-allowed;}
  button.ghost{font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:14px;background:transparent;color:var(--indigo);border:1px solid var(--indigo-soft);padding:11px 18px;border-radius:3px;cursor:pointer;}
  button.ghost:hover{background:rgba(48,64,110,0.06);}
  button.ghost:disabled{opacity:.35;cursor:not-allowed;}
  button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;}

  .source-audit{margin-top:14px;padding:10px 12px;border:1px dashed var(--indigo-soft);background:rgba(48,64,110,.05);border-radius:3px;font-size:12px;line-height:1.5;color:var(--ink-soft);}
  .source-audit b{color:var(--indigo);}
  .instructions{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:24px 26px;margin-bottom:26px;}
  .instructions h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 12px;}
  .instructions ol{margin:0;padding-left:20px;color:var(--ink-soft);font-size:14.5px;line-height:1.8;}
  .instructions ul.types{margin:10px 0 0;padding-left:20px;color:var(--ink-soft);font-size:13.5px;line-height:1.7;}

  .exam-wrap{display:grid;grid-template-columns:1fr 250px;gap:22px;}
  @media (max-width:760px){.exam-wrap{grid-template-columns:1fr;}}
  .exam-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .exam-header .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .exam-header .student-info{font-size:12px;color:var(--ink-soft);}
  .exam-header .student-info b{color:var(--indigo);font-weight:600;}
  .timer{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--indigo);padding:6px 14px;border:1px solid var(--indigo-soft);border-radius:3px;background:var(--card);}
  .timer.low{color:var(--coral);border-color:var(--coral);}

  .q-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px 28px;min-height:340px;display:flex;flex-direction:column;}
  .q-topic{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo);margin-bottom:4px;}
  .q-typebadge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ochre);letter-spacing:.03em;margin-bottom:14px;}
  .passage{background:var(--paper-alt);border-left:3px solid var(--indigo-soft);border-radius:3px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.65;color:var(--ink-soft);}
  .passage .p-title{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--ink);margin-bottom:6px;}
  .q-num{font-family:'Fraunces',serif;font-weight:900;font-size:15px;color:var(--ochre);margin-right:8px;}
  .q-text{font-size:16.5px;line-height:1.65;margin-bottom:18px;color:var(--ink);white-space:pre-line;text-align:justify;text-align-last:left;hyphens:auto;overflow-wrap:anywhere;}
  /* Semua teks stimulus/pertanyaan dibuat rata kanan-kiri (justify) pada seluruh paket. */
  .passage{ text-align:justify; text-align-last:left; hyphens:auto; overflow-wrap:anywhere; }
  .passage .p-title{ text-align:left; }
  .option .txt{font-size:14.5px;line-height:1.55;text-align:justify;text-align-last:left;hyphens:auto;overflow-wrap:anywhere;}
  table.gridq td.stmt{line-height:1.55;text-align:justify;text-align-last:left;hyphens:auto;overflow-wrap:anywhere;}
  .explain,.review-ans{ text-align:justify; text-align-last:left; hyphens:auto; overflow-wrap:anywhere; }
  .hint{font-size:12px;color:var(--indigo);font-family:'IBM Plex Mono',monospace;margin-bottom:12px;}

  .options{display:flex;flex-direction:column;gap:10px;flex:1;}
  .option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer;background:var(--paper);}
  .option:hover{border-color:var(--indigo-soft);}
  .option.selected{border-color:var(--indigo);background:rgba(48,64,110,0.08);}
  .option .key{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--indigo);min-width:20px;}
  .option .txt{font-size:14.5px;line-height:1.5;}
  .option.checkbox .key{border:1.5px solid var(--indigo-soft);border-radius:3px;width:18px;height:18px;min-width:18px;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;}
  .option.checkbox.selected .key{background:var(--indigo);color:var(--paper);}

  .gridq-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px;}
  .gridq-wrap table.gridq{min-width:620px;}
  table.gridq{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px;}
  table.gridq th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink);}
  table.gridq th.col{text-align:center;width:110px;}
  table.gridq td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.gridq td.stmt{line-height:1.5;}
  table.gridq td.col{text-align:center;}
  .radio-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--indigo-soft);display:inline-block;cursor:pointer;position:relative;}
  .radio-dot.on{border-color:var(--indigo);background:var(--indigo);}
  .radio-dot.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--paper);}
  .match-select:focus{outline:2px solid var(--ochre);outline-offset:1px;}

  .q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap;}
  .q-footer .left,.q-footer .right{display:flex;gap:10px;}
  .flag-btn{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:transparent;border:1px dashed var(--ochre);color:var(--ochre);padding:9px 14px;border-radius:3px;cursor:pointer;}
  .flag-btn.on{background:var(--ochre);color:var(--paper);border-style:solid;}

  .nav-panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;height:fit-content;position:sticky;top:20px;}
  .nav-panel h4{font-family:'Fraunces',serif;font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;max-height:260px;overflow-y:auto;}
  .nav-dot{font-family:'IBM Plex Mono',monospace;font-size:11px;width:36px;height:36px;border-radius:3px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--paper);color:var(--ink-soft);}
  .nav-dot.answered{background:var(--indigo);color:var(--paper);border-color:var(--indigo);}
  .nav-dot.flagged{border:1px dashed var(--ochre);color:var(--ochre);}
  .nav-dot.flagged.answered{background:var(--ochre);border-color:var(--ochre);color:var(--paper);}
  .nav-dot.current{outline:2px solid var(--coral);outline-offset:1px;}
  .legend{font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .legend span.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;}

  .score-hero{display:flex;gap:26px;flex-wrap:wrap;align-items:center;}
  .score-num{font-family:'Fraunces',serif;font-weight:900;font-size:64px;color:var(--indigo);line-height:1;}
  .score-sub{color:var(--ink-soft);font-size:14px;max-width:320px;}
  .bar-row{display:grid;grid-template-columns:200px 1fr 50px;align-items:center;gap:12px;margin-bottom:10px;font-size:12.5px;}
  .bar-track{background:var(--paper-alt);border:1px solid var(--line);border-radius:3px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--indigo);}

/**
 * Fisher-Yates shuffle. Mengembalikan array baru (tidak mengubah input).
 */
function shuffleArray_(arr, rng){
  const out = arr.slice();
  const random = typeof rng==='function' ? rng : Math.random;
  for(let i=out.length-1;i>0;i--){
    const j = Math.floor(random()*(i+1));
    const tmp = out[i]; out[i]=out[j]; out[j]=tmp;
  }
  return out;
}

/**
 * Mengacak urutan soal dalam satu paket, dan mengacak urutan pilihan
 * jawaban (single/multi) atau urutan pasangan kanan (match) per soal --
 * tanpa merusak kunci jawaban.
 *
 * - _qid (indeks soal asli di bank soal) TIDAK disentuh di sini; itu sudah
 *   ditempel oleh getPacketData() sebelum fungsi ini dipanggil, sehingga
 *   review Admin tetap bisa mencocokkan ke bank soal asli walau urutan
 *   tampilan berbeda per siswa.
 * - _order[posisiTampil] = indeksAsli dipasang pada tiap soal yang opsinya
 *   diacak (single/multi/match). canonicalAnswerForServer() memakai _order
 *   ini untuk menerjemahkan jawaban siswa (indeks tampilan) kembali ke
 *   indeks pilihan asli sebelum dikirim & dinilai di server.
 * - Soal bertipe grid TIDAK diacak kolomnya karena label kolom (mis.
 *   Benar/Salah) bersifat tetap secara makna, bukan pilihan acak.
 */
function randomizeQuestionSet(items, rng){
  if(!Array.isArray(items)) return items;
  const shuffled = shuffleArray_(items, rng);

  shuffled.forEach(function(item){
    if((item.type==='single' || item.type==='multi') && Array.isArray(item.opts)){
      const originalOpts = item.opts;
      const perm = shuffleArray_(originalOpts.map(function(_,i){ return i; }), rng); // perm[posisiBaru]=indeksAsli
      item.opts = perm.map(function(origIdx){ return originalOpts[origIdx]; });
      item._order = perm;

      if(item.type==='single' && Number.isInteger(item.ans)){
        item.ans = perm.indexOf(item.ans);
      } else if(item.type==='multi' && Array.isArray(item.ans)){
        item.ans = item.ans
          .map(function(origIdx){ return perm.indexOf(origIdx); })
          .sort(function(a,b){ return a-b; });
      }
    } else if(item.type==='match' && Array.isArray(item.right)){
      const originalRight = item.right;
      const perm = shuffleArray_(originalRight.map(function(_,i){ return i; }), rng);
      item.right = perm.map(function(origIdx){ return originalRight[origIdx]; });
      item._order = perm;

      if(Array.isArray(item.ans)){
        item.ans = item.ans.map(function(origIdx){
          return (origIdx===null || origIdx===undefined) ? origIdx : perm.indexOf(origIdx);
        });
      }
    }
    // type 'grid': urutan pernyataan & kolom dibiarkan tetap.
  });

  return shuffled;
}

/**
 * Mengacak urutan soal dan pilihan jawaban tanpa merusak kunci.
 * qid tetap menunjuk ke indeks soal asli sehingga review Admin dapat
 * mencocokkan jawaban siswa dengan bank soal yang sama.
 */
function makeSeededRng_(seedText){
  let h=2166136261>>>0;
  const s=String(seedText||'');
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return function(){
    h+=0x6D2B79F5;
    let t=h; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

function getPacketData(packet, mode, questionIds, seed){
  const all = PACKETS[packet];
  if(!Array.isArray(all)) return [];

  if(mode === 'exam'){
    const ids=Array.isArray(questionIds) && questionIds.length ? questionIds : Array.from({length:getQuestionPacketSize(packet)},function(_,i){return i;});
    const selected=ids.map(function(i){
      const src=all[Number(i)];
      if(!src) return null;
      const copy=JSON.parse(JSON.stringify(src));
      copy._qid=Number(i);
      return copy;
    }).filter(Boolean);
    return randomizeQuestionSet(selected, makeSeededRng_(seed||'ASTS'));
  }

  const trainingIds=Array.from({length:Math.min(10,all.length)},function(_,i){return i;});
  const training=trainingIds.map(function(i){
    const copy=JSON.parse(JSON.stringify(all[i])); copy._qid=i; return copy;
  });
  return randomizeQuestionSet(training);
}

function countQuestionTypes(data){
  const counts = {single:0, multi:0, grid:0, match:0};
  data.forEach(it=>{ if(counts[it.type] !== undefined) counts[it.type]++; });
  return counts;
}
function countCognitiveLevels(data){
  const counts={C4:0,C5:0,C6:0};
  data.forEach(it=>{ if(counts[it.cognitiveLevel]!==undefined) counts[it.cognitiveLevel]++; });
  return counts;
}

function isAnswered(item,ans){
  if(item.type==='single') return ans!==null && ans!==undefined;
  if(item.type==='multi') return Array.isArray(ans) && ans.length>0;
  if(item.type==='grid') return Array.isArray(ans) && ans.some(v=>v!==null);
  if(item.type==='match') return Array.isArray(ans) && ans.some(v=>v!==null);
  return false;
}

function isCorrect(item,ans){
  if(item.type==='single') return item.ans!==undefined && ans===item.ans;
  if(item.type==='multi'){
    if(!Array.isArray(item.ans) || !Array.isArray(ans)) return false;
    if(ans.length!==item.ans.length) return false;
    return item.ans.every(v=>ans.includes(v));
  }
  if(item.type==='grid' || item.type==='match'){
    if(!Array.isArray(item.ans) || !Array.isArray(ans) || ans.length<item.ans.length) return false;
    return item.ans.every((v,i)=>v===ans[i]);
  }
  return false;
}

function fmtTime(s){
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function topicStats(){
  const stats = {};
  DATA.forEach((it,i)=>{
    if(!stats[it.topic]) stats[it.topic]={correct:0,total:0};
    stats[it.topic].total++;
    if(isCorrect(it,state.answers[i])) stats[it.topic].correct++;
  });
  return stats;
}

      <p><b>Jumlah soal:</b> ${DATA.length}</p>
      <p><b>Benar:</b> ${finalCorrect} &nbsp; | &nbsp; <b>Salah:</b> ${finalWrong} &nbsp; | &nbsp; <b>Kosong:</b> ${finalBlank}</p>
      <p style="margin-top:14px;">Kunci jawaban dan pembahasan tidak ditampilkan pada Mode Ujian.</p>
    </div>
    <div class="footer-actions">
      <button class="primary" id="backHomeBtn">Kembali ke Halaman Awal</button>
    </div>`;
  }
  const stats = topicStats();

  // Semua paket Sekolah: hasil tetap dapat menampilkan skor, tetapi TIDAK menampilkan
  // pembahasan, kunci jawaban, maupun review jawaban per soal.
  if(VALID_PACKETS.includes(Number(state.selectedPacket))){
    return `
    <div class="hero">
      <div class="hero-inner">
        <div class="eyebrow">Hasil ASTS Sosiologi Kelas XII</div>
        <div class="score-hero">
          <div class="score-num">${score}</div>
          <div class="score-sub">Skor akhir dari ${DATA.length} soal. Jawaban benar: <b>${correctCount}</b>, belum dijawab: <b>${blankCount}</b>.</div>
        </div>
      </div>
    </div>
    <div class="instructions">
      <h3>Pengumpulan Berhasil</h3>
      <p><b>Nama:</b> ${state.studentName}</p>
      <p><b>NIS:</b> ${state.studentNIS}</p>
      <p><b>Asesmen:</b> ${getAssessmentLabel(state.selectedPacket)}</p>
      <p style="margin-top:14px;">Pembahasan dan kunci jawaban tidak ditampilkan.</p>
    </div>
    <div class="footer-actions">
      <button class="primary" id="backHomeBtn">Kembali ke Halaman Awal</button>
    </div>`;
  }

  return `
  <div class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Hasil ASTS Sosiologi Kelas XII</div>
      <div class="score-hero">
        <div class="score-num">${score}</div>
        <div class="score-sub">Skor akhir dari ${DATA.length} soal. Jawaban benar: <b>${correctCount}</b>, belum dijawab: <b>${blankCount}</b>.</div>
      </div>
    </div>
  </div>

  <div class="instructions">
    <h3>Perolehan per Topik</h3>
    ${Object.entries(stats).map(([topic,s])=>`
      <div class="bar-row">
        <span>${topic}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(s.correct/s.total)*100}%"></div></div>
        <span class="mono">${s.correct}/${s.total}</span>
      </div>
    `).join('')}
  </div>

  <h3 class="display" style="font-size:20px;margin:26px 0 14px;">Pembahasan Tiap Soal</h3>
  ${DATA.map((item,i)=>{
    const ans = state.answers[i];
    const status = !isAnswered(item,ans) ? 'blank' : (isCorrect(item,ans) ? 'correct' : 'wrong');
    const label = status==='blank' ? 'Kosong/Belum Lengkap' : (status==='correct'?'Benar':'Salah');
    return `
    <div class="review-item ${status}">
      <span class="review-badge ${status}">${label} · Soal ${i+1} · ${item.topic}</span>
      ${item.passage ? `<div class="passage" style="margin-bottom:10px;"><div class="p-title">${item.passage.title}</div>${item.passage.text}</div>` : ''}
      ${item.image ? `
        <div style="margin-bottom:10px;">
          ${item.imageIntro?`<div style="margin-bottom:6px;">${item.imageIntro}</div>`:''}
          <img src="${item.image}" alt="Ilustrasi soal" class="question-image" loading="eager" decoding="async" />
          ${item.imageCaption?`<div style="font-size:11px;color:var(--ink-soft);font-style:italic;margin-top:4px;">${item.imageCaption}</div>`:''}
        </div>
      ` : ''}
      <div class="q-text" style="font-size:14.5px;margin-bottom:10px;">${item.q}</div>
      ${renderReviewAnswer(item, ans)}
      <div class="explain">${item.exp}</div>
    </div>`;
  }).join('')}

  <div class="footer-actions">
    <button class="primary" id="retryBtn">Ulangi Ujian</button>
  </div>`;
}

function render(){
  const html = state.screen==='login'?renderLogin()
            : state.screen==='start'?renderStart()
            : state.screen==='exam'?renderExam()
            : state.screen==='result'?renderResult():'';
  document.getElementById('app').innerHTML = html;
  attachHandlers();
}

let SERVER_AUTH_SCHEMA_OK=false;
let SERVER_SYNC_MESSAGE='Server belum diverifikasi.';

function applyPacketStatusUI(){
  VALID_PACKETS.forEach(function(packet){
    var off=(PACKET_STATUS[packet]===false);
    var btn=document.querySelector('.packet-btn[data-packet="'+packet+'"]');
    if(btn){ btn.classList.toggle('disabled-by-server',off); btn.disabled=off; }
  });
  var lbl=document.getElementById('packetStatusLabel');
  var selectedOff=(PACKET_STATUS[state.selectedPacket]===false);
  if(lbl){
    lbl.textContent=selectedOff?'NONAKTIF':'AKTIF';
    lbl.classList.toggle('off',selectedOff);
    lbl.classList.toggle('on',!selectedOff);
  }
}
function loadTryoutStatus(silent){
  if(typeof google==='undefined' || !google.script || !google.script.run){
    SERVER_AUTH_SCHEMA_OK=false;
    SERVER_SYNC_MESSAGE='Server ujian belum terhubung. Muat ulang halaman atau hubungi guru pengawas.';
    return;
  }
  try{
    google.script.run.withSuccessHandler(function(info){
      SERVER_AUTH_SCHEMA_OK=!!(info &&
        info.version===APP_VERSION &&
        info.authSchema===EXPECTED_SERVER_AUTH_SCHEMA &&
        info.questionPacketSizes && Number(info.questionPacketSizes[1])===EXPECTED_QUESTION_PACKET_SIZES[1] && Number(info.questionPacketSizes[2])===EXPECTED_QUESTION_PACKET_SIZES[2] &&
        Number(info.examDurationMs)===EXPECTED_EXAM_DURATION_MS);
      SERVER_SYNC_MESSAGE=SERVER_AUTH_SCHEMA_OK
        ? 'Server login dan konfigurasi ASTS tersinkron.'
        : 'Versi server tidak sama dengan halaman siswa. Perbarui deployment Web App dengan Code.gs terbaru.';
      const rows=(info&&Array.isArray(info.packets))?info.packets:[];
      rows.forEach(function(x){
        if(VALID_PACKETS.includes(Number(x.packet))) PACKET_STATUS[Number(x.packet)]=x.active!==false;
      });
      applyPacketStatusUI();
      if(PACKET_STATUS[state.selectedPacket]===false){
        const fallback=VALID_PACKETS.find(function(p){return PACKET_STATUS[p]!==false;});
        if(fallback!==undefined && fallback!==null) state.selectedPacket=fallback;
      }
      if(!silent && state.screen==='login') render();
    }).withFailureHandler(function(){
      if(silent) return;
      SERVER_AUTH_SCHEMA_OK=false;
      SERVER_SYNC_MESSAGE='Server login tidak dapat diverifikasi. Pastikan deployment Web App menggunakan Code.gs terbaru.';
      if(state.screen==='login') render();
    }).getAppSyncInfo();
  }catch(e){
    SERVER_AUTH_SCHEMA_OK=false;
    SERVER_SYNC_MESSAGE='Server login tidak dapat diverifikasi.';
  }
}
function resetAnswers(){
  state.answers = DATA.map(it=>it.type==='multi'?[]:((it.type==='grid'||it.type==='match')?Array((it.stmts||it.left||[]).length).fill(null):null));
  state.flags = Array(DATA.length).fill(false);
}

/* ============ HANDLERS ============ */
function attachHandlers(){
  if(state.screen==='login'){
    // TRYOUT hanya memiliki satu mode: MODE UJIAN.
    state.mode='exam';

    document.querySelectorAll('.packet-btn[data-packet]').forEach(btn=>{
      if(btn.disabled || !btn.dataset.packet) return;
      btn.onclick=()=>{
        document.querySelectorAll('.packet-btn[data-packet]').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        state.selectedPacket=parseInt(btn.dataset.packet,10);
      };
    });
  }
  else if(state.screen==='start'){
    document.getElementById('startBtn').onclick = ()=>{ state.mode='exam'; state.screen='exam'; startTimer(); render(); };
  }
  else if(state.screen==='exam'){
    const item = DATA[state.current];
    if(item.type==='single'){
      document.querySelectorAll('.option').forEach(el=>{
        el.onclick = ()=>{ state.answers[state.current] = parseInt(el.dataset.i); render(); };
        el.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } };
      });
    } else if(item.type==='multi'){
      document.querySelectorAll('.option.checkbox').forEach(el=>{
        el.onclick = ()=>{
          const i = parseInt(el.dataset.i);
          const cur = Array.isArray(state.answers[state.current]) ? state.answers[state.current] : [];
          const idx = cur.indexOf(i);
          if(idx===-1) cur.push(i); else cur.splice(idx,1);
          state.answers[state.current] = cur;
          render();
        };
        el.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } };
      });
    } else if(item.type==='match'){
      document.querySelectorAll('.match-select').forEach(el=>{
        el.onchange = ()=>{
          const r=parseInt(el.dataset.row);
          const cur=Array.isArray(state.answers[state.current]) ? state.answers[state.current].slice() : Array(item.left.length).fill(null);
          cur[r]=el.value===''?null:parseInt(el.value);
          state.answers[state.current]=cur;
          render();
        };
      });
    } else if(item.type==='grid'){
      document.querySelectorAll('.radio-dot').forEach(el=>{
        el.onclick = ()=>{
          const r = parseInt(el.dataset.row), c = parseInt(el.dataset.col);
          const cur = Array.isArray(state.answers[state.current]) ? state.answers[state.current].slice() : Array(item.stmts.length).fill(null);
          cur[r] = c;
          state.answers[state.current] = cur;
          render();
        };
      });
    }
    document.querySelectorAll('.nav-dot').forEach(el=>{
      el.onclick = ()=>{ state.current = parseInt(el.dataset.goto); render(); };
    });
    const prev = document.getElementById('prevBtn');
    if(prev) prev.onclick = ()=>{ if(state.current>0){ state.current--; render(); } };
    const next = document.getElementById('nextBtn');
    if(next) next.onclick = ()=>{ if(state.current<DATA.length-1){ state.current++; render(); } };
    const flagBtn = document.getElementById('flagBtn');
    if(flagBtn) flagBtn.onclick = ()=>{ state.flags[state.current] = !state.flags[state.current]; render(); };
    const finish = document.getElementById('finishBtn');
    if(finish) finish.onclick = window.finishAssessment;
    const finishSide = document.getElementById('finishBtnSide');
    if(finishSide) finishSide.onclick = window.finishAssessment;
  }
  else if(state.screen==='result'){
    const back=document.getElementById('backHomeBtn');
    if(back) back.onclick=()=>{
      resetAnswers(); state.screen='login'; state.current=0; state.timeLeft=DURATION; state.timerId=null;
      state.studentName=''; state.studentNIS=''; state.studentPIN=''; state.selectedPacket=PACKET_TRYOUT_1; render();
    };
    const retry=document.getElementById('retryBtn');
    if(retry) retry.onclick=()=>{
      resetAnswers(); state.screen='login'; state.current=0; state.timeLeft=DURATION; state.timerId=null;
      state.studentName=''; state.studentNIS=''; state.studentPIN=''; state.selectedPacket=PACKET_TRYOUT_1; render();
    };
  }
}

function startTimer(){
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    const td = document.getElementById('timerDisplay');
    if(td){ td.textContent = fmtTime(state.timeLeft); if(state.timeLeft<=300) td.classList.add('low'); }
    if(state.timeLeft<=0){ clearInterval(state.timerId); finishExam(); }
  },1000);
}

function finishExam(){
  // Fungsi ini adalah fallback untuk Mode Latihan (state.mode!=='exam').
  // Untuk Mode Ujian, fungsi ini DITIMPA oleh script#server-integration
  // (lihat blok "finishExam=function(){...}" di bawah), yang mengirim
  // jawaban ke server lewat submitExam() sebelum pindah ke layar hasil.
  // Penandaan "sudah submit" untuk Mode Ujian sepenuhnya ditangani di
  // server (Code.gs), bukan di sini.
  if(state.timerId) clearInterval(state.timerId);
  state.screen='result';
  render();
  window.scrollTo(0,0);
}

render();
</script>

<script>
(function(){
  'use strict';
  const DRAFT_KEY='TRYOUT_KELAS_XII_SOSIOLOGI_DRAFT_V1';
  const RESULT_KEY='TRYOUT_KELAS_XII_SOSIOLOGI_LAST_RESULT_V1';
  let deadline=0, lastSave=0, lastTick=0;
  const baseRender=render;
  const baseFinish=finishExam;

  function safeClone(v){ return JSON.parse(JSON.stringify(v)); }
  function saveDraft(){
    if(!['start','exam'].includes(state.screen) || !DATA.length) return;
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        version:5, savedAt:Date.now(), screen:state.screen, mode:state.mode,
        data:safeClone(DATA),
        studentName:state.studentName, studentNIS:state.studentNIS, studentUsername:state.studentUsername,
        selectedPacket:state.selectedPacket,current:state.current,
        answers:safeClone(state.answers),flags:safeClone(state.flags),
        timeLeft:state.timeLeft, deadline:deadline||Date.now()+state.timeLeft*1000
      }));
      lastSave=Date.now();
    }catch(e){}
  }
  function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
  // clearDraft() dipakai juga dari script#server-integration (blok <script>
  // yang terpisah), jadi harus dijembatani lewat window — sama seperti pola
  // window.__serverExam yang sudah dipakai di file ini. Tanpa ini, memanggil
  // clearDraft() langsung dari script lain akan melempar ReferenceError
  // karena fungsi ini scoped ke IIFE ENHANCEMENT LAYER saja.
  window.clearDraft = clearDraft;
  function getDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null')}catch(e){return null}}
  function restoreDraft(d){
    if(!d || ![3,4,5].includes(d.version) || !PACKETS[d.selectedPacket]) return false;
    DATA=Array.isArray(d.data)&&d.data.length ? safeClone(d.data) : getPacketData(d.selectedPacket, d.mode||'training'); window.DATA = DATA;
    state.mode='exam'; state.studentName=d.studentName||''; state.studentNIS=d.studentNIS||''; state.studentPIN=d.studentPIN||'';
    state.selectedPacket=Number(d.selectedPacket);
    state.current=Math.max(0,Math.min(Number(d.current)||0,DATA.length-1));
    state.answers=Array.isArray(d.answers)?d.answers:[];
    if(state.answers.length!==DATA.length){ resetAnswers(); }
    else { state.answers=DATA.map((it,i)=>it.type==='multi'?(Array.isArray(state.answers[i])?state.answers[i].filter(n=>Number.isInteger(n)&&n>=0&&n<it.opts.length):[]):(it.type==='grid'||it.type==='match')?(Array.isArray(state.answers[i])?state.answers[i].slice(0,(it.stmts||it.left).length).map(v=>(Number.isInteger(v)&&v>=0&&v<(it.colLabels||it.right).length)?v:null):Array((it.stmts||it.left).length).fill(null)):(Number.isInteger(state.answers[i])&&state.answers[i]>=0&&state.answers[i]<it.opts.length?state.answers[i]:null)); }
    state.flags=Array.isArray(d.flags)&&d.flags.length===DATA.length?d.flags.map(Boolean):Array(DATA.length).fill(false);
    state.timeLeft=Math.max(0,Number(d.timeLeft)||0);
    deadline=Number(d.deadline)||Date.now()+state.timeLeft*1000;
    state.screen='exam';
    if(!state.answers.length) resetAnswers();
    if(state.timeLeft<=0){ clearDraft(); state.screen='result'; return false; }
    return true;
  }
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

  // Add progress + autosave marker to the exam page.
  function enhanceExam(){
    if(state.screen!=='exam') return;
    document.body.classList.toggle('exam-lock',state.mode==='exam');
    const card=document.querySelector('.exam-wrap>div:first-child');
    if(!card) return;
    const header=card.querySelector('.exam-header');
    if(header && !card.querySelector('.enhance-strip')){
      const answered=DATA.filter((it,i)=>isAnswered(it,state.answers[i])).length;
      const pct=Math.round(answered/DATA.length*100);
      const strip=document.createElement('div'); strip.className='enhance-strip';
      strip.innerHTML=`<strong>Progres ${answered}/${DATA.length} (${pct}%)</strong><span>·</span><span>Autosave aktif</span><span class="auto-save" id="saveStatus">✓ Tersimpan</span><span style="margin-left:auto">Navigasi: <span class="kbd">←</span> <span class="kbd">→</span> · Tandai: <span class="kbd">F</span></span>`;
      header.insertAdjacentElement('afterend',strip);
      const prog=document.createElement('div'); prog.className='progress-wrap';
      prog.innerHTML=`<div class="progress-head"><span>Progress pengerjaan</span><span>${pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      strip.insertAdjacentElement('afterend',prog);
    }
  }

  // Resume banner on login when a session exists.
  function enhanceLogin(){
    // Login server sekarang menggunakan username + password.
    // Resume sesi ujian ditangani oleh server-integration di bawah.
    if(state.screen!=='login') return;
    const toggle=document.getElementById('togglePasswordBtn');
    const pass=document.getElementById('passwordInput');
    if(toggle && pass){
      const eyeOpen='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      const eyeOff='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.7 21.7 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>';
      toggle.onclick=function(){
        const showing=pass.type==='text';
        pass.type=showing?'password':'text';
        toggle.innerHTML=showing?eyeOpen:eyeOff;
      };
    }
  }

  // Result enhancements.
  function enhanceResult(){
    if(state.screen!=='result' || state.mode==='exam') return;
    const hero=document.querySelector('.score-hero');
    if(!hero || document.querySelector('.stat-grid')) return;
    const correct=DATA.filter((it,i)=>isCorrect(it,state.answers[i])).length;
    const answered=DATA.filter((it,i)=>isAnswered(it,state.answers[i])).length;
    const blank=DATA.length-answered, wrong=answered-correct;
    const grid=document.createElement('div'); grid.className='stat-grid';
    grid.innerHTML=`<div class="stat-card"><div class="n">${correct}</div><div class="l">Jawaban benar</div></div><div class="stat-card"><div class="n">${wrong}</div><div class="l">Jawaban salah</div></div><div class="stat-card"><div class="n">${blank}</div><div class="l">Belum dijawab</div></div><div class="stat-card"><div class="n">${Math.round(correct/DATA.length*100)}%</div><div class="l">Akurasi akhir</div></div>`;
    hero.parentElement.insertAdjacentElement('afterend',grid);
    const actions=document.querySelector('.footer-actions');
    if(actions && !actions.querySelector('#printResultBtn')){
      actions.insertAdjacentHTML('afterbegin','<button class="ghost no-print" id="printResultBtn">Cetak / Simpan PDF</button><button class="ghost no-print" id="exportResultBtn">Ekspor JSON</button><button class="ghost no-print" id="exportCsvBtn">Ekspor CSV</button>');
      document.getElementById('printResultBtn').onclick=()=>window.print();
      document.getElementById('exportResultBtn').onclick=exportResult; document.getElementById('exportCsvBtn').onclick=exportCSV;
    }
    try{localStorage.setItem(RESULT_KEY,JSON.stringify({date:new Date().toISOString(),student:state.studentName,nis:state.studentNIS,packet:state.selectedPacket,score:Math.round(correct/DATA.length*100),correct,wrong,blank}));}catch(e){}
  }
  function exportResult(){
    const rows=DATA.map((it,i)=>({no:i+1,topic:it.topic,type:it.type,status:!isAnswered(it,state.answers[i])?'Kosong':isCorrect(it,state.answers[i])?'Benar':'Salah'}));
    const payload={student:state.studentName,nis:state.studentNIS,packet:state.selectedPacket,score:Math.round(rows.filter(r=>r.status==='Benar').length/DATA.length*100),generatedAt:new Date().toISOString(),items:rows};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`hasil-asts-sosiologi-paket-${state.selectedPacket}-${(state.studentNIS||'siswa')}.json`;a.click();URL.revokeObjectURL(url);
  }

  function exportCSV(){
    const escCsv=v=>`\"${String(v??'').replace(/\"/g,'\"\"')}\"`;
    const rows=DATA.map((it,i)=>({no:i+1,topic:it.topic,type:it.type,status:!isAnswered(it,state.answers[i])?'Kosong':isCorrect(it,state.answers[i])?'Benar':'Salah'}));
    const header=['No','Topik','Tipe Soal','Status'];
    const csv=[header.map(escCsv).join(','),...rows.map(r=>[r.no,r.topic,r.type,r.status].map(escCsv).join(','))].join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`hasil-asts-sosiologi-paket-${state.selectedPacket}-${(state.studentNIS||'siswa')}.csv`;a.click();URL.revokeObjectURL(url);
  }

  function enhancedRender(){
    document.body.classList.toggle('exam-lock',state.mode==='exam' && state.screen==='exam');
    baseRender();
    enhanceLogin(); enhanceExam(); enhanceResult();
    saveDraft();
  }
  render=enhancedRender;

  // Use real elapsed time instead of relying on interval count.
  startTimer=function(){
    if(state.timerId) clearInterval(state.timerId);
    if(!deadline || deadline<=Date.now() || Math.abs(deadline-(Date.now()+state.timeLeft*1000))>5000) deadline=Date.now()+state.timeLeft*1000;
    const tick=()=>{
      state.timeLeft=Math.max(0,Math.ceil((deadline-Date.now())/1000));
      const td=document.getElementById('timerDisplay');
      if(td){td.textContent=fmtTime(state.timeLeft);td.classList.toggle('low',state.timeLeft<=300);}
      if(Date.now()-lastSave>5000) saveDraft();
      if(state.timeLeft<=0){clearInterval(state.timerId);state.timerId=null;finishExam();}
    };
    tick(); state.timerId=setInterval(tick,250);
  };

  // Confirm finish + clear draft on submission.
  // Penyelesaian tryout dibuat sebagai fungsi global agar kedua tombol
  // 'Selesai' selalu bekerja setelah setiap render/pergantian soal.
  window.finishAssessment = function(){
    if(state.screen!=='exam') return false;
    const unanswered=DATA.filter((it,i)=>!isAnswered(it,state.answers[i])).length;
    const msg=unanswered
      ? `Masih ada ${unanswered} soal yang belum dijawab.\n\nYakin ingin mengakhiri ASTS dan mengirim jawaban?`
      : 'Yakin ingin mengakhiri ASTS dan mengirim jawaban?';
    if(!window.confirm(msg)) return false;

    // Mode Ujian wajib melalui finishExam() agar jawaban dan nilai
    // benar-benar diverifikasi serta disimpan oleh server.
    if(state.mode==='exam'){
      finishExam();
      return true;
    }

    if(state.timerId) clearInterval(state.timerId);
    state.timerId=null;
    clearDraft();
    state.screen='result';
    render();
    window.scrollTo(0,0);
    return true;
  };
  window.__finishAssessment = window.finishAssessment;

  // Event delegation: tetap bekerja walaupun elemen tombol dibuat ulang oleh render().
  if(!window.__finishClickBound){
    document.addEventListener('click',function(e){
      const btn=e.target && e.target.closest ? e.target.closest('#finishBtn, #finishBtnSide') : null;
      if(!btn) return;
      e.preventDefault();
      e.stopPropagation();
      window.finishAssessment();
    }, true);
    window.__finishClickBound=true;
  }

  // Keyboard navigation during exam.
  document.addEventListener('keydown',e=>{
    if(state.screen!=='exam') return;
    const tag=(e.target.tagName||'').toLowerCase(); if(['input','textarea','select'].includes(tag)) return;
    if(e.key==='ArrowLeft' && state.current>0){e.preventDefault();state.current--;render();}
    if(e.key==='ArrowRight' && state.current<DATA.length-1){e.preventDefault();state.current++;render();}
    if(e.key.toLowerCase()==='f'){e.preventDefault();state.flags[state.current]=!state.flags[state.current];render();}
  });
  window.addEventListener('beforeunload',e=>{if(state.screen==='exam'){saveDraft();e.preventDefault();e.returnValue='';}});

  // Initial enhancement after the original application boot.
  setTimeout(()=>{enhanceLogin();enhanceExam();enhanceResult();},0);
})();
</script>
